name: Auto Update Upstream

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/**
      - tests/**
  schedule:
    - cron: '22 4 * * 0' # Sunday at 09:52 IST
  workflow_dispatch:

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    name: Check & Update Google Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      has_update: ${{ steps.updater.outputs.has_update }}
      version: ${{ steps.updater.outputs.version }}
      build: ${{ steps.updater.outputs.build }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable user namespaces for runtime sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run Updater Unit Tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Update Script
        id: updater
        run: python3 scripts/update.py

      - name: Capture source metadata before running the candidate
        id: candidate
        if: steps.updater.outputs.has_update == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: pkgs/antigravity-ide/sources.json
          if-no-files-found: error
          retention-days: 7

      - name: Install headless display test tools
        if: steps.updater.outputs.has_update == 'true'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y xvfb dbus-x11 xauth

      - name: Flake Check
        if: steps.updater.outputs.has_update == 'true'
        run: nix flake check --all-systems

      - name: Build and verify update if changed
        if: steps.updater.outputs.has_update == 'true'
        run: nix build .#default --impure --print-build-logs

      - name: Run Runtime Smoke Test
        if: steps.updater.outputs.has_update == 'true'
        run: xvfb-run -a dbus-run-session --config-file=tests/dbus-session.conf -- python3 scripts/check-smoke.py

  publish:
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.has_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the exact validated base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated source metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          merge-multiple: true
          path: candidate

      - name: Commit and push validated update
        env:
          VERSION: ${{ needs.update.outputs.version }}
          BUILD: ${{ needs.update.outputs.build }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD" =~ ^[0-9]+$ ]]
          jq -e --arg version "$VERSION" --arg build "$BUILD" \
            '.version == $version and .build == $build' candidate/sources.json > /dev/null
          cp candidate/sources.json pkgs/antigravity-ide/sources.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/antigravity-ide/sources.json
          git commit -m "chore(release): bump Antigravity IDE to ${VERSION}"
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release Antigravity IDE v${VERSION} (build ${BUILD})"
          fi
          git push --atomic origin HEAD:refs/heads/main --tags

      - name: Generate Release Notes
        id: notes
        run: |
          python3 scripts/generate-release-notes.py "v${{ needs.update.outputs.version }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: "v${{ needs.update.outputs.version }}"
          name: "${{ steps.notes.outputs.title }}"
          body_path: release-notes.md
